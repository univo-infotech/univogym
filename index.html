<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Univo Gym Management - Stronger Today, Healthier Tomorrow" />
    <title>Univo Gym Management</title>
    <script>
      // Automatically redirect non-hash paths (e.g. /register/... or /register-trainer/...) to HashRouter path
      (function() {
        var pathname = window.location.pathname;
        if (pathname && pathname !== '/' && !window.location.hash) {
          window.location.replace(window.location.origin + '/#' + pathname + window.location.search);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
